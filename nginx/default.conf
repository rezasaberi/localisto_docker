server {
    listen 80;
    index index.php;
    server_name admin.localisto.local api.localisto.local;

    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    server_name localisto.local;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /frontend/ {
        return 302 /;
    }

    location = /frontend/index.html {
        if ($request_uri ~ ^/frontend/) {
            return 302 /;
        }
        try_files $uri =404;
    }

    location ~ ^/frontend/(products|promotions|promotion|services|service|gallery)\.html$ {
        if ($request_uri ~ ^/frontend/) {
            return 302 /;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri @rewrite_slug;
    }

    location @rewrite_slug {
        rewrite ^/[^/]+/?$ /frontend/index.html last;
        rewrite ^/[^/]+/(.*)$ /frontend/$1 last;
        return 404;
    }
}
