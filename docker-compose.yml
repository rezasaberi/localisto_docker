services:
  php:
    container_name: php_localisto
    build:
      context: .
      dockerfile: ./php/Dockerfile
    volumes:
      - ../backend:/var/www
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - localisto
    ports:
      - "6001:6001"
    entrypoint: >
      sh -c "
        chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache &&
        php-fpm
      "

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_localisto
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - localisto

  mysql:
    image: mysql:8.0
    container_name: mysql_localisto
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: localisto
      MYSQL_ROOT_PASSWORD: saberi
      MYSQL_USER: localisto_user
      MYSQL_PASSWORD: localisto_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - localisto
    healthcheck:
      # Use CMD-SHELL so the MYSQL_ROOT_PASSWORD environment variable is expanded inside the container.
      # Use $$ to escape the $ so Compose does not substitute it at config time; Compose will send a single $ to the container.
      test: ["CMD-SHELL", "mysqladmin --protocol=TCP ping -h mysql_localisto -u root -p\"$$MYSQL_ROOT_PASSWORD\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7
    container_name: redis_localisto
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - localisto

  nginx:
    image: nginx:alpine
    container_name: nginx_localisto
    ports:
      - "80:80"
    volumes:
      - ../backend:/var/www
      - ../index.html:/usr/share/nginx/html/index.html:ro
      - ../frontend:/usr/share/nginx/html/frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
    networks:
      - localisto

volumes:
  mysql_data:
  redis_data:

networks:
  localisto:
